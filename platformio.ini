; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = "наш первый проект по последнему релизу ёрадио"
extra_configs = 
	config_DevBoard_ESP32_Wrover-kit.ini
	config_DevBoard_ESP32_S3-kit.ini

default_envs = esp32-wrover-kit
;default_envs = esp32-s3-kit

[common]
;это просто любое имя (здесь - custom common options) общий блок для всего проекта (это называется Interpolation of Values)
;можно Общие флаги компиляции (build_flags =), Базовые зависимости, общие для всех плат (lib_deps_builtin =, lib_deps_external = ),Пути к общим библиотекам (lib_extra_dirs =)
;нельзя указывать platform, board, framework — это параметры конкретной среды. 
build_flags = 
	-DVERSION=0.0.1
    -DCORE_DEBUG_LEVEL=3
    -Iconfig          ; ← добавляет папку config (в ней настройки пинов)/ в пути поиска
    -D_IR_ENABLE_DEFAULT_=false
 ;   -DDECODE_NEC=true
    -DNDEBUG  # Отключить отладочные сообщения

;исключить лишние файлы из сборки
build_src_filter = 
    +<*> 
    -<src/displays/displayGC9106.cpp>
    -<src/displays/displayGC9A01A.cpp>
    -<src/displays/displayILI9225.cpp>
    -<src/displays/displayILI9488.cpp>
    -<src/displays/displayLC1602.cpp>
    -<src/displays/displayN5110.cpp>
    -<src/displays/displaySH1106.cpp>
    -<src/displays/displaySSD1305.cpp>
    -<src/displays/displaySSD1306.cpp>
    -<src/displays/displaySSD1322.cpp>
    -<src/displays/displaySSD1327.cpp>
    -<src/displays/displayST7735.cpp>
    -<src/displays/displayST7789.cpp>
    -<src/displays/displayST7796.cpp>
    -<src/displays/displayST7920.cpp>
    -<src/displays/nextion.cpp>

    -<src/audioVS1053/audioVS1053Ex.cpp>

    -<src/IRremoteESP8266/*>
   ; +<src/IRremoteESP8266/IRac.cpp>
    +<src/IRremoteESP8266/IRrecv.cpp>
    +<src/IRremoteESP8266/IRsend.cpp>
    +<src/IRremoteESP8266/IRtext.cpp>
    +<src/IRremoteESP8266/IRtimer.cpp>
    +<src/IRremoteESP8266/IRutils.cpp>
    +<src/IRremoteESP8266/ir_NEC.cpp>

    -<src/Adafruit_GFX_Library/Adafruit_GrayOLED.cpp>
    -<src/Adafruit_GFX_Library/fontconvert/fontconvert.c>
    -<src/SSD1322/SSD1322.cpp>
    -<src/LiquidCrystalI2C/LiquidCrystalI2CEx.cpp>

[env]
framework = arduino
;platform = espressif32
;board = esp-wrover-kit

;build_src_filter = ${common.build_src_filter}  ;с исключением лишних файлов флеш занят на 71,2% а без 72.0% = смысла в исключении нет, т.е. экономия только времени компиляции


;board_build.filesystem = littlefs  ;в этом проекте не пашет (Поддерживает каталоги)
;board_build.filesystem = SPIFFS    ;а с этим пашет (по умолчанию уже стоит) (Не поддерживает каталоги)
;upload_speed = 115200
upload_speed = 921600 ;115200 ;

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, time
monitor_echo = yes




